# Local development stack.
# Prerequisites:
#   1. Copy .env.example to .env and fill in your GCP project values.
#   2. Set AGENT_ENGINE_ID in .env to your deployed Vertex AI Hosting Agent resource name.
#   3. Run: docker compose up --build
#
# The MCP servers run locally. The frontend connects to your cloud-deployed
# Agent Engine (AGENT_ENGINE_ID) and authenticates via Application Default
# Credentials (ADC). Ensure `gcloud auth application-default login` has been run.

services:
  cocktail-mcp:
    build:
      context: ./src/mcp_servers/cocktail_mcp_server
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"

  weather-mcp:
    build:
      context: ./src/mcp_servers/weather_mcp_server
    ports:
      - "8082:8080"
    environment:
      PORT: "8080"

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - cocktail-mcp
      - weather-mcp
