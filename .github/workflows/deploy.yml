name: Deploy A2A Multiagent App

on:
  push:
    branches:
      - staging
      - main

env:
  REGION: us-central1
  SERVICE_NAME: a2a-frontend-adk-memory
  PYTHON_VERSION: '3.12'

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: dw-genai-dev
      PROJECT_NUMBER: '496235138247'
      WORKLOAD_IDENTITY_PROVIDER: 'projects/496235138247/locations/global/workloadIdentityPools/github/providers/github-actions'
      SERVICE_ACCOUNT: 'github-runner@dw-genai-dev.iam.gserviceaccount.com'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Detect which components have code changes
      - name: Detect changed components
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            cocktail_mcp:
              - 'src/mcp_servers/cocktail_mcp_server/**'
            weather_mcp:
              - 'src/mcp_servers/weather_mcp_server/**'
            agents:
              - 'src/a2a_agents/**'
              - 'deployment/deploy_agents.py'
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/deploy.yml'
            terraform:
              - 'deployment/terraform/**'

      # 1. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2. Check existing resources to skip deploy when they already exist
      - name: Check existing Cloud Run services
        id: check_services
        run: |
          # Check Cocktail MCP Server
          CT_IMAGE=$(gcloud run services describe cocktail-remote-mcp-server-adk-memory \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "")
          if [ -n "$CT_IMAGE" ] && [ "$CT_IMAGE" != "us-docker.pkg.dev/cloudrun/container/hello" ]; then
            echo "COCKTAIL_MCP_EXISTS=true" >> $GITHUB_OUTPUT
            echo "Cocktail MCP Server already deployed. Skipping."
          else
            echo "COCKTAIL_MCP_EXISTS=false" >> $GITHUB_OUTPUT
          fi

          # Check Weather MCP Server
          WEA_IMAGE=$(gcloud run services describe weather-remote-mcp-server-adk-memory \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "")
          if [ -n "$WEA_IMAGE" ] && [ "$WEA_IMAGE" != "us-docker.pkg.dev/cloudrun/container/hello" ]; then
            echo "WEATHER_MCP_EXISTS=true" >> $GITHUB_OUTPUT
            echo "Weather MCP Server already deployed. Skipping."
          else
            echo "WEATHER_MCP_EXISTS=false" >> $GITHUB_OUTPUT
          fi

          # Check Frontend
          FE_IMAGE=$(gcloud run services describe a2a-frontend-adk-memory \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "")
          if [ -n "$FE_IMAGE" ] && [ "$FE_IMAGE" != "us-docker.pkg.dev/cloudrun/container/hello" ]; then
            echo "FRONTEND_EXISTS=true" >> $GITHUB_OUTPUT
            echo "Frontend already deployed. Skipping."
          else
            echo "FRONTEND_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Check existing Agent Engines
        id: check_agents
        if: steps.changes.outputs.agents == 'true' || steps.changes.outputs.terraform == 'true'
        run: |
          HOSTING_AGENT=$(curl -s \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://${{ env.REGION }}-aiplatform.googleapis.com/v1beta1/projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/reasoningEngines" \
            | jq -r '.reasoningEngines[] | select(.displayName == "Hosting Agent adk-memory - ADK") | .name' \
            | head -1)
          if [ -n "$HOSTING_AGENT" ]; then
            echo "AGENTS_EXIST=true" >> $GITHUB_OUTPUT
            echo "AGENT_ENGINE_ID=${HOSTING_AGENT}" >> $GITHUB_OUTPUT
            echo "Agent engines already exist. Hosting Agent: ${HOSTING_AGENT}. Skipping deploy."
          else
            echo "AGENTS_EXIST=false" >> $GITHUB_OUTPUT
            echo "No existing agent engines found. Will deploy."
          fi

      # 3. Deploy MCP Servers (only if code changed AND service not already deployed)
      - name: Deploy Cocktail MCP Server
        if: steps.changes.outputs.cocktail_mcp == 'true' && steps.check_services.outputs.COCKTAIL_MCP_EXISTS != 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-adk-memory \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy Weather MCP Server
        if: steps.changes.outputs.weather_mcp == 'true' && steps.check_services.outputs.WEATHER_MCP_EXISTS != 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-adk-memory \
            --project ${{ env.PROJECT_ID }}

      # 4. Deploy A2A Agents (only if code changed AND agents don't already exist)
      - name: Set up Python
        if: steps.changes.outputs.agents == 'true' && steps.check_agents.outputs.AGENTS_EXIST != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.changes.outputs.agents == 'true' && steps.check_agents.outputs.AGENTS_EXIST != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install keyrings.google-artifactregistry-auth
          .venv/bin/pip install -e . --extra-index-url https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/

      - name: Run A2A Deploy Script
        if: steps.changes.outputs.agents == 'true' && steps.check_agents.outputs.AGENTS_EXIST != 'true'
        id: deploy_agents
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          GOOGLE_CLOUD_REGION: ${{ env.REGION }}
          CT_MCP_SERVER_URL: 'https://cocktail-remote-mcp-server-adk-memory-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          WEA_MCP_SERVER_URL: 'https://weather-remote-mcp-server-adk-memory-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          PYTHONPATH: src
        run: |
          .venv/bin/python deployment/deploy_agents.py

      # 5. Deploy Frontend (only if code changed AND service not already deployed)
      - name: Build Frontend Image
        if: steps.changes.outputs.frontend == 'true' && steps.check_services.outputs.FRONTEND_EXISTS != 'true'
        run: |
          gcloud builds submit ./src/frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-adk-memory \
            --project ${{ env.PROJECT_ID }}

      # 6. Deploy Infrastructure via Terraform (only if config changed)
      - name: Setup Terraform
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        run: |
          gcloud storage buckets describe gs://${{ env.PROJECT_ID }}-terraform-state 2>/dev/null || \
          gcloud storage buckets create gs://${{ env.PROJECT_ID }}-terraform-state \
            --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }}

      - name: Terraform Init
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=a2a-multiagent-adk-memory-cicd/staging"
        working-directory: deployment/terraform

      - name: Import existing Cloud Run services into Terraform state
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        working-directory: deployment/terraform
        run: |
          terraform import \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="staging_project_id=${{ env.PROJECT_ID }}" \
            -var="prod_project_id=${{ env.PROJECT_ID }}" \
            -var="repository_name=a2a-multiagent-adk-memory-cicd" \
            -var="repository_owner=wadave" \
            -var="agent_engine_id=${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID || steps.check_agents.outputs.AGENT_ENGINE_ID || 'unset' }}" \
            google_cloud_run_v2_service.cocktail_mcp_server \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/cocktail-remote-mcp-server-adk-memory" 2>/dev/null || true
          terraform import \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="staging_project_id=${{ env.PROJECT_ID }}" \
            -var="prod_project_id=${{ env.PROJECT_ID }}" \
            -var="repository_name=a2a-multiagent-adk-memory-cicd" \
            -var="repository_owner=wadave" \
            -var="agent_engine_id=${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID || steps.check_agents.outputs.AGENT_ENGINE_ID || 'unset' }}" \
            google_cloud_run_v2_service.weather_mcp_server \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/weather-remote-mcp-server-adk-memory" 2>/dev/null || true
          terraform import \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="staging_project_id=${{ env.PROJECT_ID }}" \
            -var="prod_project_id=${{ env.PROJECT_ID }}" \
            -var="repository_name=a2a-multiagent-adk-memory-cicd" \
            -var="repository_owner=wadave" \
            -var="agent_engine_id=${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID || steps.check_agents.outputs.AGENT_ENGINE_ID || 'unset' }}" \
            google_cloud_run_v2_service.a2a_frontend \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/a2a-frontend-adk-memory" 2>/dev/null || true

      - name: Terraform Apply
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        run: |
          terraform apply -auto-approve \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="staging_project_id=${{ env.PROJECT_ID }}" \
            -var="prod_project_id=${{ env.PROJECT_ID }}" \
            -var="repository_name=a2a-multiagent-adk-memory-cicd" \
            -var="repository_owner=wadave" \
            -var="agent_engine_id=${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID || steps.check_agents.outputs.AGENT_ENGINE_ID || 'unset' }}"
        working-directory: deployment/terraform

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
