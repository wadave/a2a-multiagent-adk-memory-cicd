name: Deploy A2A Multiagent App

on:
  push:
    branches:
      - staging
      - main
    paths-ignore:
      - '**.md'
      - 'assets/**'
  workflow_dispatch:

env:
  REGION: us-central1
  PYTHON_VERSION: '3.12'

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed components
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            cocktail_mcp:
              - 'src/mcp_servers/cocktail_mcp_server/**'
            weather_mcp:
              - 'src/mcp_servers/weather_mcp_server/**'
            agents:
              - 'src/a2a_agents/**'
              - 'deployment/deploy_agents.py'
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/deploy.yml'
            terraform:
              - 'deployment/terraform/**'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      # ── Build Container Images ──────────────────────────────────────────────

      - name: Build and push Cocktail MCP Server
        if: steps.changes.outputs.cocktail_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-adk-mb:latest \
            --project ${{ env.PROJECT_ID }}

      - name: Build and push Weather MCP Server
        if: steps.changes.outputs.weather_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-adk-mb:latest \
            --project ${{ env.PROJECT_ID }}

      - name: Build and push Frontend
        if: steps.changes.outputs.frontend == 'true'
        run: |
          gcloud builds submit ./src/frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-adk-mb:latest \
            --project ${{ env.PROJECT_ID }}

      # ── Single Terraform Apply ──────────────────────────────────────────────
      # Reads the previously deployed agent_engine_id from Secret Manager
      # (written by a prior run). "unset" is used as the safe default on first run,
      # which causes the Gemini Enterprise registration module to be skipped.

      - name: Get previous agent engine ID
        id: prev_agent_id
        run: |
          AGENT_ID=$(gcloud secrets versions access latest \
            --secret=agent-engine-id \
            --project=${{ env.PROJECT_ID }} 2>/dev/null || echo "unset")
          echo "AGENT_ENGINE_ID=${AGENT_ID}" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        run: |
          gcloud storage buckets describe gs://${{ env.PROJECT_ID }}-terraform-state 2>/dev/null || \
          gcloud storage buckets create gs://${{ env.PROJECT_ID }}-terraform-state \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Terraform Init
        working-directory: deployment/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=${{ github.event.repository.name }}/${{ github.ref_name }}"

      - name: Terraform Apply
        working-directory: deployment/terraform
        run: |
          terraform apply -auto-approve \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="deploy_project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="project_number=${{ env.PROJECT_NUMBER }}" \
            -var="repository_name=${{ github.event.repository.name }}" \
            -var="repository_owner=${{ github.repository_owner }}" \
            -var="agent_engine_id=${{ steps.prev_agent_id.outputs.AGENT_ENGINE_ID }}" \
            -var="oauth_client_id_secret_name=${{ vars.OAUTH_CLIENT_ID_SECRET_NAME || '' }}" \
            -var="ge_app_staging=${{ vars.GE_APP_STAGING || '' }}" \
            -var="ge_app_prod=${{ vars.GE_APP_PROD || '' }}"

      # ── Get MCP URLs from Terraform outputs ────────────────────────────────

      - name: Get MCP server URLs
        id: mcp_urls
        working-directory: deployment/terraform
        run: |
          echo "CT_MCP_SERVER_URL=$(terraform output -raw cocktail_mcp_server_url)" >> $GITHUB_OUTPUT
          echo "WEA_MCP_SERVER_URL=$(terraform output -raw weather_mcp_server_url)" >> $GITHUB_OUTPUT

      # ── Deploy Agents ───────────────────────────────────────────────────────

      - name: Install Python dependencies
        if: steps.changes.outputs.agents == 'true' || steps.changes.outputs.cocktail_mcp == 'true' || steps.changes.outputs.weather_mcp == 'true'
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install keyrings.google-artifactregistry-auth
          uv pip install -e ".[agent-engine]" \
            --extra-index-url https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/
          uv pip install a2a-sdk google-adk --no-deps --target src/ \
            --extra-index-url https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/

      - name: Deploy A2A Agents
        if: steps.changes.outputs.agents == 'true' || steps.changes.outputs.cocktail_mcp == 'true' || steps.changes.outputs.weather_mcp == 'true'
        id: deploy_agents
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          LOCATION: ${{ env.REGION }}
          CT_MCP_SERVER_URL: ${{ steps.mcp_urls.outputs.CT_MCP_SERVER_URL }}
          WEA_MCP_SERVER_URL: ${{ steps.mcp_urls.outputs.WEA_MCP_SERVER_URL }}
        run: |
          source .venv/bin/activate
          python deployment/deploy_agents.py

      # ── Publish agent_engine_id to Secret Manager ───────────────────────────
      # The frontend reads this secret at container startup via the Python
      # Secret Manager client (see src/frontend/main.py).

      - name: Update agent engine ID in Secret Manager
        if: steps.deploy_agents.outputs.AGENT_ENGINE_ID != ''
        run: |
          printf '%s' "${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}" | \
            gcloud secrets versions add agent-engine-id \
              --project=${{ env.PROJECT_ID }} \
              --data-file=-

          # Re-deploy the frontend with the same image to create a new revision
          # that starts up fresh and picks up the updated secret value.
          FRONTEND_IMAGE=$(gcloud run services describe a2a-frontend-adk-mb \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || \
            echo "gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-adk-mb:latest")

          gcloud run deploy a2a-frontend-adk-mb \
            --image="${FRONTEND_IMAGE}" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      # ── Configure Model Armor floor settings ───────────────────────────────
      # Runs after terraform apply so that all IAM bindings (modelarmor.admin,
      # projectViewer, serviceUsageConsumer) have had time to propagate.
      # roles/modelarmor.admin alone does not include resourcemanager.projects.get;
      # roles/resourcemanager.projectViewer (added in iam.tf) fills that gap.

      - name: Configure Model Armor floor settings
        run: |
          for i in $(seq 1 12); do
            if gcloud model-armor floorsettings update \
              --full-uri=projects/${{ env.PROJECT_ID }}/locations/global/floorSetting \
              --enable-floor-setting-enforcement=TRUE \
              --add-integrated-services=VERTEX_AI \
              --vertex-ai-enforcement-type=INSPECT_AND_BLOCK \
              --enable-vertex-ai-cloud-logging \
              --pi-and-jailbreak-filter-settings-enforcement=enable \
              --pi-and-jailbreak-filter-settings-confidence-level=low-and-above \
              --malicious-uri-filter-settings-enforcement=ENABLED \
              --rai-settings-filters="confidenceLevel=LOW_AND_ABOVE,filterType=HATE_SPEECH","confidenceLevel=LOW_AND_ABOVE,filterType=DANGEROUS","confidenceLevel=LOW_AND_ABOVE,filterType=SEXUALLY_EXPLICIT","confidenceLevel=LOW_AND_ABOVE,filterType=HARASSMENT" \
              --project=${{ env.PROJECT_ID }}; then
              echo "Model Armor floor settings configured successfully."
              break
            fi
            echo "Retrying Model Armor configuration... ($i/12)"
            sleep 15
          done

      # ── Summary ─────────────────────────────────────────────────────────────

      - name: Deployment Summary
        run: |
          echo "### Deployment Summary — ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cocktail MCP | ${{ steps.changes.outputs.cocktail_mcp == 'true' && 'Updated' || 'Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Weather MCP  | ${{ steps.changes.outputs.weather_mcp == 'true' && 'Updated' || 'Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Agents       | ${{ steps.changes.outputs.agents == 'true' && 'Updated' || 'Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend     | ${{ steps.changes.outputs.frontend == 'true' && 'Updated' || 'Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cocktail MCP URL:** ${{ steps.mcp_urls.outputs.CT_MCP_SERVER_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Weather MCP URL:** ${{ steps.mcp_urls.outputs.WEA_MCP_SERVER_URL }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}" ]; then
            echo "**Agent Engine ID:** ${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}" >> $GITHUB_STEP_SUMMARY
          fi
