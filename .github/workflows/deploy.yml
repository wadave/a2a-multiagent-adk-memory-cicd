name: Deploy A2A Multiagent App

on:
  push:
    branches:
      - staging
      - main
    paths-ignore:
      - '**.md'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      deploy_agents:
        description: 'Force re-deploy A2A agents (even if code unchanged)'
        type: boolean
        default: false
      deploy_mcp:
        description: 'Force re-build & deploy MCP servers (also triggers agent re-deploy)'
        type: boolean
        default: false
      deploy_frontend:
        description: 'Force re-build & deploy frontend'
        type: boolean
        default: false

env:
  REGION: us-central1
  PYTHON_VERSION: '3.12'

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 ensures the base commit from github.event.before is
          # always available, regardless of how many commits are in the push.
          fetch-depth: 0

      - name: Detect changed components
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            cocktail_mcp:
              - 'src/mcp_servers/cocktail_mcp_server/**'
            weather_mcp:
              - 'src/mcp_servers/weather_mcp_server/**'
            agents:
              - 'src/a2a_agents/**'
              - 'deployment/deploy_agents.py'
              - 'pyproject.toml'
              - 'uv.lock'
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/deploy.yml'
            terraform:
              - 'deployment/terraform/**'
              - '!deployment/terraform/shells/**'
            terraform_shells:
              - 'deployment/terraform/shells/**'

      # Merge change-detection results with manual workflow_dispatch overrides.
      # All subsequent steps read from steps.flags.outputs.* so the logic is
      # defined in one place.
      - name: Resolve deployment flags
        id: flags
        run: |
          DEPLOY_COCKTAIL=false
          DEPLOY_WEATHER=false
          DEPLOY_AGENTS=false
          DEPLOY_FRONTEND=false

          [[ "${{ steps.changes.outputs.cocktail_mcp }}" == "true" || "${{ inputs.deploy_mcp }}" == "true" ]] \
            && DEPLOY_COCKTAIL=true || true
          [[ "${{ steps.changes.outputs.weather_mcp }}" == "true" || "${{ inputs.deploy_mcp }}" == "true" ]] \
            && DEPLOY_WEATHER=true || true
          [[ "${{ steps.changes.outputs.agents }}" == "true" \
            || "$DEPLOY_COCKTAIL" == "true" || "$DEPLOY_WEATHER" == "true" \
            || "${{ inputs.deploy_agents }}" == "true" ]] \
            && DEPLOY_AGENTS=true || true
          [[ "${{ steps.changes.outputs.frontend }}" == "true" || "${{ inputs.deploy_frontend }}" == "true" ]] \
            && DEPLOY_FRONTEND=true || true

          echo "cocktail_mcp=$DEPLOY_COCKTAIL" >> $GITHUB_OUTPUT
          echo "weather_mcp=$DEPLOY_WEATHER"   >> $GITHUB_OUTPUT
          echo "agents=$DEPLOY_AGENTS"         >> $GITHUB_OUTPUT
          echo "frontend=$DEPLOY_FRONTEND"     >> $GITHUB_OUTPUT

          echo "Deployment flags:"
          echo "  Cocktail MCP : $DEPLOY_COCKTAIL"
          echo "  Weather MCP  : $DEPLOY_WEATHER"
          echo "  Agents       : $DEPLOY_AGENTS"
          echo "  Frontend     : $DEPLOY_FRONTEND"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      # ── Build Container Images ──────────────────────────────────────────────

      - name: Build and push Cocktail MCP Server
        if: steps.flags.outputs.cocktail_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-adk-mb:latest \
            --project ${{ env.PROJECT_ID }}

      - name: Build and push Weather MCP Server
        if: steps.flags.outputs.weather_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-adk-mb:latest \
            --project ${{ env.PROJECT_ID }}

      - name: Build and push Frontend
        if: steps.flags.outputs.frontend == 'true'
        run: |
          gcloud builds submit ./src/frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-adk-mb:latest \
            --project ${{ env.PROJECT_ID }}

      # ── Terraform Apply — Infrastructure ──────────────────────────────────
      # Creates Cloud Run shells (placeholder images), IAM, secrets, Model Armor API.
      # Does NOT manage container images or GE registration.

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        run: |
          gcloud storage buckets describe gs://${{ env.PROJECT_ID }}-terraform-state 2>/dev/null || \
          gcloud storage buckets create gs://${{ env.PROJECT_ID }}-terraform-state \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Terraform Init (infra)
        working-directory: deployment/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=${{ github.event.repository.name }}/${{ github.ref_name }}"

      - name: Terraform State RM GitHub Resources
        working-directory: deployment/terraform
        run: |
          terraform state rm 'github_repository_environment.staging' || true
          terraform state rm 'github_repository_environment.main' || true
          terraform state rm 'github_actions_environment_variable.ge_app_staging' || true
          terraform state rm 'github_actions_environment_variable.ge_app_prod' || true
          terraform state rm 'github_actions_environment_variable.oauth_client_id_secret_name' || true

      - name: Terraform Apply (infra)
        working-directory: deployment/terraform
        run: |
          terraform apply -auto-approve \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="deploy_project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="project_number=${{ env.PROJECT_NUMBER }}" \
            -var="repository_name=${{ github.event.repository.name }}" \
            -var="repository_owner=${{ github.repository_owner }}"

      # ── Get MCP URLs from Terraform outputs ────────────────────────────────

      - name: Get MCP server URLs
        id: mcp_urls
        working-directory: deployment/terraform
        run: |
          echo "CT_MCP_SERVER_URL=$(terraform output -raw cocktail_mcp_server_url)" >> $GITHUB_OUTPUT
          echo "WEA_MCP_SERVER_URL=$(terraform output -raw weather_mcp_server_url)" >> $GITHUB_OUTPUT

      # ── Deploy Cloud Run Services via gcloud ───────────────────────────────
      # Terraform created the shells; gcloud updates them with real images.

      - name: Deploy Cocktail MCP to Cloud Run
        if: steps.flags.outputs.cocktail_mcp == 'true'
        run: |
          gcloud run deploy cocktail-remote-mcp-server-adk-mb \
            --image gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-adk-mb:latest \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy Weather MCP to Cloud Run
        if: steps.flags.outputs.weather_mcp == 'true'
        run: |
          gcloud run deploy weather-remote-mcp-server-adk-mb \
            --image gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-adk-mb:latest \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      # ── Deploy Agents ───────────────────────────────────────────────────────
      # Agent deployment always runs to keep deployed code in sync with HEAD.
      # deploy_agents.py is idempotent — updates existing, creates new.

      - name: Install Python dependencies
        run: |
          uv sync --locked --extra agent-engine

      - name: Deploy A2A Agents
        id: deploy_agents
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          LOCATION: ${{ env.REGION }}
          CT_MCP_SERVER_URL: ${{ steps.mcp_urls.outputs.CT_MCP_SERVER_URL }}
          WEA_MCP_SERVER_URL: ${{ steps.mcp_urls.outputs.WEA_MCP_SERVER_URL }}
        run: |
          uv run python deployment/deploy_agents.py

      # ── Deploy Frontend via gcloud ──────────────────────────────────────────
      # Deployed after agents so AGENT_ENGINE_ID is available for env vars.

      - name: Deploy Frontend to Cloud Run
        if: steps.flags.outputs.frontend == 'true' || steps.deploy_agents.outputs.AGENT_ENGINE_ID != ''
        run: |
          gcloud run deploy a2a-frontend-adk-mb \
            --image gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-adk-mb:latest \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --set-env-vars "PROJECT_ID=${{ env.PROJECT_ID }},PROJECT_NUMBER=${{ env.PROJECT_NUMBER }},GOOGLE_CLOUD_LOCATION=${{ env.REGION }}"

      # ── Publish agent_engine_id to Secret Manager ───────────────────────────
      # The frontend reads this secret at container startup via the REST API.

      - name: Update agent engine ID in Secret Manager
        if: steps.deploy_agents.outputs.AGENT_ENGINE_ID != ''
        run: |
          printf '%s' "${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}" | \
            gcloud secrets versions add agent-engine-id \
              --project=${{ env.PROJECT_ID }} \
              --data-file=-

      # ── Terraform Apply — Shells (GE Registration) ─────────────────────────
      # Separate Terraform root with its own state. Only runs when a valid
      # AGENT_ENGINE_ID is available. No -target flag needed — this root
      # contains only GE registration resources.

      - name: Terraform Init (shells)
        if: steps.deploy_agents.outputs.AGENT_ENGINE_ID != ''
        working-directory: deployment/terraform/shells
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=${{ github.event.repository.name }}/${{ github.ref_name }}-shells"

      - name: Terraform Apply (shells — GE registration)
        if: steps.deploy_agents.outputs.AGENT_ENGINE_ID != ''
        working-directory: deployment/terraform/shells
        run: |
          terraform apply -auto-approve \
            -var="deploy_project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="project_number=${{ env.PROJECT_NUMBER }}" \
            -var="agent_engine_id=${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}" \
            -var="oauth_client_id_secret_name=${{ vars.OAUTH_CLIENT_ID_SECRET_NAME || '' }}" \
            -var="ge_app_staging=${{ vars.GE_APP_STAGING || '' }}" \
            -var="ge_app_prod=${{ vars.GE_APP_PROD || '' }}"

      # ── Configure Model Armor floor settings ───────────────────────────────
      # Runs after terraform apply so all IAM bindings have had time to propagate.

      - name: Configure Model Armor floor settings
        run: |
          for i in $(seq 1 12); do
            if gcloud model-armor floorsettings update \
              --full-uri=projects/${{ env.PROJECT_ID }}/locations/global/floorSetting \
              --enable-floor-setting-enforcement=TRUE \
              --add-integrated-services=VERTEX_AI \
              --vertex-ai-enforcement-type=INSPECT_AND_BLOCK \
              --enable-vertex-ai-cloud-logging \
              --pi-and-jailbreak-filter-settings-enforcement=enable \
              --pi-and-jailbreak-filter-settings-confidence-level=low-and-above \
              --malicious-uri-filter-settings-enforcement=ENABLED \
              --rai-settings-filters="confidenceLevel=LOW_AND_ABOVE,filterType=HATE_SPEECH","confidenceLevel=LOW_AND_ABOVE,filterType=DANGEROUS","confidenceLevel=LOW_AND_ABOVE,filterType=SEXUALLY_EXPLICIT","confidenceLevel=LOW_AND_ABOVE,filterType=HARASSMENT" \
              --project=${{ env.PROJECT_ID }}; then
              echo "Model Armor floor settings configured successfully."
              break
            fi
            echo "Retrying Model Armor configuration... ($i/12)"
            sleep 15
          done

      # ── Summary ─────────────────────────────────────────────────────────────

      - name: Deployment Summary
        run: |
          echo "### Deployment Summary — ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cocktail MCP | ${{ steps.flags.outputs.cocktail_mcp == 'true' && 'Updated' || 'Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Weather MCP  | ${{ steps.flags.outputs.weather_mcp == 'true' && 'Updated' || 'Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Agents       | Updated (always) |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend     | ${{ steps.flags.outputs.frontend == 'true' && 'Updated' || 'Unchanged' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cocktail MCP URL:** ${{ steps.mcp_urls.outputs.CT_MCP_SERVER_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Weather MCP URL:** ${{ steps.mcp_urls.outputs.WEA_MCP_SERVER_URL }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}" ]; then
            echo "**Agent Engine ID:** ${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}" >> $GITHUB_STEP_SUMMARY
          fi
