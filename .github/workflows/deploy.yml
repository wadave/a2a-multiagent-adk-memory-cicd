name: Deploy A2A Multiagent App

on:
  push:
    branches:
      - staging
      - main

env:
  REGION: us-central1
  SERVICE_NAME: a2a-frontend-adk-memory
  PYTHON_VERSION: '3.12'

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: dw-genai-dev
      PROJECT_NUMBER: '496235138247'
      WORKLOAD_IDENTITY_PROVIDER: 'projects/496235138247/locations/global/workloadIdentityPools/github/providers/github-actions'
      SERVICE_ACCOUNT: 'github-runner@dw-genai-dev.iam.gserviceaccount.com'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Detect which components have code changes
      - name: Detect changed components
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            cocktail_mcp:
              - 'src/mcp_servers/cocktail_mcp_server/**'
            weather_mcp:
              - 'src/mcp_servers/weather_mcp_server/**'
            agents:
              - 'src/a2a_agents/**'
              - 'deployment/deploy_agents.py'
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/deploy.yml'
            terraform:
              - 'deployment/terraform/**'

      # 1. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2. Deploy MCP Servers to Cloud Run (only if code changed)
      - name: Deploy Cocktail MCP Server
        if: steps.changes.outputs.cocktail_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-adk-memory \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy Weather MCP Server
        if: steps.changes.outputs.weather_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-adk-memory \
            --project ${{ env.PROJECT_ID }}

      # 3. Deploy A2A Agents (only if code changed)
      - name: Set up Python
        if: steps.changes.outputs.agents == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.changes.outputs.agents == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install keyrings.google-artifactregistry-auth
          .venv/bin/pip install -e . --extra-index-url https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/

      - name: Run A2A Deploy Script
        if: steps.changes.outputs.agents == 'true'
        id: deploy_agents
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          GOOGLE_CLOUD_REGION: ${{ env.REGION }}
          CT_MCP_SERVER_URL: 'https://cocktail-remote-mcp-server-adk-memory-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          WEA_MCP_SERVER_URL: 'https://weather-remote-mcp-server-adk-memory-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          PYTHONPATH: src
        run: |
          .venv/bin/python deployment/deploy_agents.py

      # 4. Deploy Frontend (only if code changed)
      - name: Build Frontend Image
        if: steps.changes.outputs.frontend == 'true'
        run: |
          gcloud builds submit ./src/frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-adk-memory \
            --project ${{ env.PROJECT_ID }}

      # 5. Deploy Infrastructure via Terraform (only if config changed)
      - name: Setup Terraform
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        run: |
          gcloud storage buckets describe gs://${{ env.PROJECT_ID }}-terraform-state 2>/dev/null || \
          gcloud storage buckets create gs://${{ env.PROJECT_ID }}-terraform-state \
            --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }}

      - name: Terraform Init
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=a2a-multiagent-adk-memory-cicd/staging"
        working-directory: deployment/terraform

      - name: Terraform Apply
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        run: |
          terraform apply -auto-approve \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="staging_project_id=${{ env.PROJECT_ID }}" \
            -var="prod_project_id=${{ env.PROJECT_ID }}" \
            -var="repository_name=a2a-multiagent-adk-memory-cicd" \
            -var="repository_owner=wadave" \
            -var="agent_engine_id=${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}"
        working-directory: deployment/terraform

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: dw-genai-prod
      PROJECT_NUMBER: '101916374866'
      WORKLOAD_IDENTITY_PROVIDER: 'projects/101916374866/locations/global/workloadIdentityPools/github/providers/github-actions'
      SERVICE_ACCOUNT: 'github-runner@dw-genai-prod.iam.gserviceaccount.com'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Detect which components have code changes
      - name: Detect changed components
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            cocktail_mcp:
              - 'src/mcp_servers/cocktail_mcp_server/**'
            weather_mcp:
              - 'src/mcp_servers/weather_mcp_server/**'
            agents:
              - 'src/a2a_agents/**'
              - 'deployment/deploy_agents.py'
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/deploy.yml'
            terraform:
              - 'deployment/terraform/**'

      # 1. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2. Deploy MCP Servers to Cloud Run (only if code changed)
      - name: Deploy Cocktail MCP Server
        if: steps.changes.outputs.cocktail_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-adk-memory \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy Weather MCP Server
        if: steps.changes.outputs.weather_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-adk-memory \
            --project ${{ env.PROJECT_ID }}

      # 3. Deploy A2A Agents (only if code changed)
      - name: Set up Python
        if: steps.changes.outputs.agents == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.changes.outputs.agents == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install keyrings.google-artifactregistry-auth
          .venv/bin/pip install -e . --extra-index-url https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/

      - name: Run A2A Deploy Script
        if: steps.changes.outputs.agents == 'true'
        id: deploy_agents
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          GOOGLE_CLOUD_REGION: ${{ env.REGION }}
          CT_MCP_SERVER_URL: 'https://cocktail-remote-mcp-server-adk-memory-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          WEA_MCP_SERVER_URL: 'https://weather-remote-mcp-server-adk-memory-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          PYTHONPATH: src
        run: |
          .venv/bin/python deployment/deploy_agents.py

      # 4. Deploy Frontend (only if code changed)
      - name: Build Frontend Image
        if: steps.changes.outputs.frontend == 'true'
        run: |
          gcloud builds submit ./src/frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-adk-memory \
            --project ${{ env.PROJECT_ID }}

      # 5. Deploy Infrastructure via Terraform (only if config changed)
      - name: Setup Terraform
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        run: |
          gcloud storage buckets describe gs://${{ env.PROJECT_ID }}-terraform-state 2>/dev/null || \
          gcloud storage buckets create gs://${{ env.PROJECT_ID }}-terraform-state \
            --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }}

      - name: Terraform Init
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true'
        run: |
          terraform init \
