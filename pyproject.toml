[project]
name = "a2a-multiagent-adk-memory-cicd"
version = "0.1.0"
description = "Multi-agent orchestration demo using Google ADK, A2A protocol, and MCP on Google Cloud."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=0.3.5",
    "click>=8.2.1",
    "google-adk>=1.14.1",
    "google-auth-oauthlib>=1.2.2",
    "google-auth>=2.40.3",
    "google-cloud-aiplatform>=1.113.0",
    "google-cloud-logging>=3.11.0",
    "google-genai>=1.36.0",
    "gradio>=5.46.1",
    "python-dotenv>=1.0.0",
    "geopy>=2.4.1",
    "aiobreaker>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "fastmcp>=2.8.0",
    "httpx>=0.28.1",
    "ruff>=0.9.0",
    "ipykernel>=6.30.1",
]
agent-engine = [
    "google-cloud-aiplatform[agent_engines,adk]>=1.113.0",
    "google-genai>=1.36.0",
    "pydantic>=2.0.0",
    "cloudpickle>=3.1.0",
    "python-dotenv>=1.0.0",
    "google-cloud-logging>=3.11.0",
    "aiobreaker>=1.2.0",
    "a2a-sdk>=0.3.5",
    "google-adk>=1.14.1",
    "google-auth-oauthlib>=1.2.2",
    "google-auth>=2.40.3",
    "click>=8.2.1",
    "geopy>=2.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require running services)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

