[project]
name = "a2a-multiagent-adk-memory-cicd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=0.3.5",
    "black>=25.9.0",
    "click>=8.2.1",
    "flake8>=7.3.0",
    "google-adk>=1.14.1",
    "google-auth-oauthlib>=1.2.2",
    "google-auth[openid]>=2.40.3",
    "google-cloud-aiplatform>=1.113.0",
    "google-genai>=1.36.0",
    "gradio>=5.46.1",
    "ipykernel>=6.30.1",
    "nbqa>=1.9.1",
    "pip>=25.2",
    "python-dotenv>=1.0.0",
    "geopy>=2.4.1",
    "google-cloud-logging>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "fastmcp>=2.8.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require running services)",
]

[tool.uv]
[[tool.uv.index]]
name = "google-ar"
url = "https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/"
explicit = true

[tool.uv.sources]
a2a-sdk = { index = "google-ar" }
google-adk = { index = "google-ar" }
