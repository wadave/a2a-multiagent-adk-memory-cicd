[project]
name = "a2a-frontend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "a2a-sdk>=0.3.5",
    "click>=8.2.1",
    "google-adk>=1.14.1",
    "google-auth-oauthlib>=1.2.2",
    "google-auth[openid]>=2.40.3",
    "google-cloud-aiplatform>=1.113.0",
    "google-genai>=1.36.0",
    "gradio>=5.46.1",
]

[tool.uv]
[[tool.uv.index]]
name = "google-ar"
url = "https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/"
explicit = true

[tool.uv.sources]
a2a-sdk = { index = "google-ar" }
google-adk = { index = "google-ar" }

