[project]
name = "a2a-frontend"
version = "0.1.0"
description = "Gradio-based web interface for the A2A multi-agent demo."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
  "a2a-sdk>=0.3.5",
  "click>=8.2.1",
  "google-adk>=1.14.1",
  "google-auth-oauthlib>=1.2.2",
  "google-auth[openid]>=2.40.3",
  "google-cloud-aiplatform>=1.113.0",
  "google-genai>=1.36.0",
  "gradio>=5.46.1",
  "httpx>=0.28.1",
  "python-dotenv>=1.0.0"
]
